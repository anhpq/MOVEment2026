<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640" role="img" aria-labelledby="title desc">
  <title id="title">Futuristic neon map marker</title>
  <desc id="desc">A cyan and purple futuristic map pin with concentric rings and circuit details.</desc>
  <defs>
    <linearGradient id="pinGradient" x1="90" y1="70" x2="420" y2="560" gradientUnits="userSpaceOnUse">
