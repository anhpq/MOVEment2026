    </linearGradient>
    <linearGradient id="ringGradient" x1="165" y1="150" x2="360" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#72f7ff"/><stop offset="0.52" stop-color="#4cc8e7"/><stop offset="1" stop-color="#df73dc"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="45%" r="60%">
