name: Deploy Backend (ECS)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to deploy
        required: true
        default: master
        type: choice
        options:
          - master
      backup_confirmed:
        description: Type BACKUP_CONFIRMED, or SKIP_BACKUP_USER_APPROVED only after explicit user approval
        required: true
        type: string
      deploy_backend:
        description: Type deploy-backend to authorize the Backend deployment
        required: true
        type: string
      base_commit:
        description: Currently deployed commit when the server marker is unavailable
        required: false
        type: string
      target_commit:
        description: Optional commit reachable from target_branch; defaults to origin/target_branch
        required: false
        type: string
      force_database_steps:
        description: Force migration, seed, and database verification
        required: true
        default: false
        type: boolean

concurrency:
  group: be-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_PATH: /opt/movement/app
  APP_NAME: movement-api

jobs:
  deploy:
    name: Pull code and restart on ECS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ inputs.target_branch }}
          GIT_REPO_URL: git@github.com:${{ github.repository }}.git
          APP_NAME: ${{ env.APP_NAME }}
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
          DEPLOY_BACKEND: ${{ inputs.deploy_backend }}
          BASE_COMMIT: ${{ inputs.base_commit }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          FORCE_DATABASE_STEPS: ${{ inputs.force_database_steps }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: 22
          envs: DEPLOY_PATH,DEPLOY_BRANCH,GIT_REPO_URL,APP_NAME,BACKUP_CONFIRMED,DEPLOY_BACKEND,BASE_COMMIT,TARGET_COMMIT,FORCE_DATABASE_STEPS
          script: |
            set -euo pipefail

            case "${BACKUP_CONFIRMED}" in
              BACKUP_CONFIRMED)
                echo "Fresh Production backup confirmed."
                ;;
              SKIP_BACKUP_USER_APPROVED)
                echo "WARNING: Production backup skipped by explicit user approval."
                ;;
              *)
                echo "Use BACKUP_CONFIRMED or the explicitly approved SKIP_BACKUP_USER_APPROVED override."
                exit 1
                ;;
            esac
            if [ "${DEPLOY_BACKEND}" != "deploy-backend" ]; then
              echo "Backend deployment authorization is invalid."
              exit 1
            fi

            # Handle three cases without deleting the tree (preserves be/.env):
            # 1) no .git + non-empty dir -> init/fetch/checkout in place
            # 2) no .git + missing/empty dir -> clone
            # 3) .git present -> fetch + hard reset to DEPLOY_BRANCH
            if [ ! -d "${DEPLOY_PATH}/.git" ]; then
              if [ -d "${DEPLOY_PATH}" ] && [ -n "$(ls -A "${DEPLOY_PATH}" 2>/dev/null || true)" ]; then
                cd "${DEPLOY_PATH}"
                git init
                git remote add origin "${GIT_REPO_URL}" 2>/dev/null \
                  || git remote set-url origin "${GIT_REPO_URL}"
                git fetch --depth=1 origin "${DEPLOY_BRANCH}"
                git checkout -B "${DEPLOY_BRANCH}" "origin/${DEPLOY_BRANCH}"
              else
                mkdir -p "$(dirname "${DEPLOY_PATH}")"
                git clone --branch "${DEPLOY_BRANCH}" "${GIT_REPO_URL}" "${DEPLOY_PATH}"
              fi
            else
              cd "${DEPLOY_PATH}"
              git fetch origin
              git checkout "${DEPLOY_BRANCH}"
              git reset --hard "origin/${DEPLOY_BRANCH}"
            fi

            if [ ! -f "${DEPLOY_PATH}/be/.env" ]; then
              echo "Missing ${DEPLOY_PATH}/be/.env on the ECS host."
              echo "Create it from be/deploy/.env.example with production DATABASE_URL, JWT_SECRET, SCORING_CODE, CORS_ORIGIN."
              exit 1
            fi

            export DEPLOY_PATH DEPLOY_BRANCH GIT_REPO_URL APP_NAME BASE_COMMIT TARGET_COMMIT FORCE_DATABASE_STEPS
            bash "${DEPLOY_PATH}/be/deploy/deploy.sh"
