name: Deploy Frontend (OBS)

on:
  push:
    branches:
      - master
    paths:
      - 'fe/**'
      - '.github/workflows/fe-deploy.yml'
  workflow_dispatch:

concurrency:
  group: fe-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  HUAWEI_REGION: ap-southeast-3
  OBS_BUCKET: movement
  NODE_VERSION: '20'

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate API base URL
        run: |
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "VITE_API_BASE_URL repository variable is missing or empty."
            echo "This workflow deploys directly to OBS, which cannot reverse proxy same-origin /api requests."
            echo "Set VITE_API_BASE_URL to an HTTPS API origin, or deploy the frontend behind deploy/nginx/movement.conf instead."
            exit 1
          fi

          case "${VITE_API_BASE_URL}" in
            *obs-website*|*obs.*myhuaweicloud.com*)
              echo "VITE_API_BASE_URL points at OBS/static hosting, not the backend API."
              echo "Current value: ${VITE_API_BASE_URL}"
              exit 1
              ;;
          esac

          case "${VITE_API_BASE_URL}" in
            https://*)
              ;;
            *)
              echo "VITE_API_BASE_URL must be HTTPS when set for deployed frontend builds."
              echo "Use an HTTPS API origin for OBS static hosting, or serve /api through the production reverse proxy."
              exit 1
              ;;
          esac
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Build production bundle
        run: npm run build:prod
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fe-dist
          path: fe/dist
          retention-days: 1

  deploy:
    name: Deploy to OBS
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: fe-dist
          path: dist

      - name: Install obsutil
        run: |
          wget -q https://obs-community-intl.obs.ap-southeast-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz
          tar -xzf obsutil_linux_amd64.tar.gz
          OBSUTIL_BIN="$(find . -maxdepth 2 -name obsutil -type f | head -1)"
          chmod 755 "${OBSUTIL_BIN}"
          echo "OBSUTIL_BIN=${OBSUTIL_BIN}" >> "${GITHUB_ENV}"

      - name: Sync dist to OBS bucket
        env:
          OBS_REPORT_DIR: ${{ github.workspace }}/obsutil-report
        run: |
          set -euo pipefail

          "${OBSUTIL_BIN}" config -i="${{ secrets.HUAWEI_ACCESS_KEY }}" \
            -k="${{ secrets.HUAWEI_SECRET_KEY }}" \
            -e="https://obs.${{ env.HUAWEI_REGION }}.myhuaweicloud.com"

          mkdir -p "${OBS_REPORT_DIR}"

          # obsutil exits 8 when any single object fails, and the per-object cause
          # is only written to the result files in -o, never to stdout.
          dump_failed_report() {
            echo "obsutil failure details:"
            find "${OBS_REPORT_DIR}" -type f -name '*failed_report*' -print -exec cat {} \; || true
          }

          # sync skips objects already present with the same size/mtime, so a retry
          # only re-uploads what actually failed.
          run_with_retry() {
            local label="$1"
            shift

            local attempt
            for attempt in 1 2 3; do
              echo "${label}: attempt ${attempt}/3"
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
            done

            echo "${label}: failed after 3 attempts."
            return 1
          }

          # -j=3 instead of the default 5: throughput to this region is low enough
          # that 5 parallel uploads starve the largest map asset into a timeout.
          if ! run_with_retry "Sync dist to OBS" \
            "${OBSUTIL_BIN}" sync dist/ "obs://${{ env.OBS_BUCKET }}/" \
            -acl=public-read -j=3 -o="${OBS_REPORT_DIR}"; then
            dump_failed_report
            exit 1
          fi

          # SPA entry point: always fetch fresh so new JS/CSS hashes are picked up
          run_with_retry "Upload index.html" \
            "${OBSUTIL_BIN}" cp dist/index.html "obs://${{ env.OBS_BUCKET }}/index.html" \
            -acl=public-read -meta=Cache-Control:no-cache,no-store,must-revalidate

      - name: Upload obsutil result files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: obsutil-report
          path: obsutil-report
          if-no-files-found: ignore
          retention-days: 3

      - name: Deployment summary
        run: |
          echo "Frontend deployed to obs://${{ env.OBS_BUCKET }}/"
          echo "Region: ${{ env.HUAWEI_REGION }}"
          echo "Ensure OBS static website hosting has index.html as both index and error document."
